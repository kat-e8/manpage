[project]
name = "postgres-mcp"
version = "0.1.0"
description = "MCP server for ad-hoc Postgres access, with a per-call connection_uri override"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "mcp>=1.0.0",
    "fastmcp>=2.12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
